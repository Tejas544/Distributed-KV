\* FINDING -- this configuration is REQUIRED TO FAIL, on NoWriteSkew, and the
\* failure is ANV-0065 rather than a control.
\*
\* Parallel commit at serializable. The record goes to kStaging with the full
\* key list and is implicitly committed once every listed key carries its
\* intent, so a reader that meets an intent can reach the verdict without the
\* coordinator. TLC's counterexample is thirteen steps and ends in
\* ResolveStaging:
\*
\*   t1 and t2 begin, each writes one key and reads the other's, both write
\*   staging records, t1 prewrites and commits, t2 prewrites -- and then a
\*   *reader* resolves t2's staging record, because every key it lists carries
\*   its intent. That implicit commit skips the read refresh. t2's coordinator,
\*   had it got there first, would have found its read set invalidated by t1
\*   and aborted. Whichever of the two wins the race decides, and one of the two
\*   outcomes is the write skew serializability forbids.
\*
\* This is exactly the hazard recorded at the end of P6 -- "a coordinator can
\* still write kAborted over a staging record whose intents are all present, if
\* the read refresh fails at serializable... the measurement that would show it
\* is a recovering reader racing an aborting coordinator, and it is the first
\* thing to build if parallel commit is ever taken further". No seed in the
\* fault sweep produced it. The spec produced it in one second, which is the
\* argument for writing specs.
\*
\* parallel_commit is off by default in CoordinatorOptions, so nothing ships
\* with this behaviour; it is a control in the drill. SsiParallelSnapshot.cfg
\* is the companion that isolates the cause: parallel commit at snapshot
\* isolation, where there is no refresh to skip, passes every invariant.

SPECIFICATION Spec

CONSTANTS
    Key = {k1, k2}
    Txn = {t1, t2}
    MaxTs = 6
    RefreshReadsOnPush = TRUE
    ParallelCommit = TRUE

    NoRecord = "NoRecord"
    Pending = "Pending"
    Staging = "Staging"
    Committed = "Committed"
    Aborted = "Aborted"

\* Transactions terminate, so a state with nothing enabled is the protocol
\* finishing rather than a deadlock. TLC's default reading of "no successor"
\* is the opposite one.
CHECK_DEADLOCK FALSE

CONSTRAINT StateConstraint

INVARIANT
    TypeOk
    KeyListIsComplete
    CommitIsAllOrNothing
    AbortLeavesNothing
    VersionsCarryCommitTs
    SnapshotIsolation
    NoWriteSkew

PROPERTY TerminalIsFinal
