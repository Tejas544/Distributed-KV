\* The companion to RaftFigure8.cfg: the same constructed region with the
\* Figure-8 restriction IN PLACE, which must be clean.
\*
\* Without this run the negative control proves only that *something* about
\* that region is reachable. With it, the pair is a discrimination: the region
\* contains a LeaderCompleteness violation exactly when the restriction is
\* removed.
\*
\* RaftOptions::commit_only_current_term set to false: a leader may advance its
\* commit index onto an entry from a previous term on replica count alone.
\*
\* Five voters, and started from a constructed configuration -- RaftFigure8.tla
\* carries the argument for both, and the short version is that the scenario
\* needs a minority of two and is about twenty steps deep, which is past what a
\* search from the initial state reaches. Run at the three voters of Raft.cfg
\* this same knob passes 214,061,180 states without a violation, and that
\* measurement is worth as much as the control: it is how large a configuration
\* has to be before the property stops being vacuous.
\*
\* RaftFigure8Ok.cfg is the companion, identical but with the restriction in
\* place, and it must be clean over the same region.

SPECIFICATION F8Spec

CONSTANTS
    Server = {s1, s2, s3, s4, s5}
    Nil = Nil
    Value = {v1}
    InitialVoters = {s1, s2, s3, s4, s5}
    Learners = {}
    ConfigChoices = {}
    MaxTerm = 4
    MaxLogLen = 1
    LeaderOld = s1
    LeaderNew = s5
    StaleValue = v1
    MaxMessages = 5
    CommitOnlyCurrentTerm = TRUE
    JointRequiresCommit = TRUE
    EnableHeartbeat = FALSE
    Campaigners = {s1}

    Follower = "Follower"
    Candidate = "Candidate"
    Leader = "Leader"

    RequestVoteRequest = "RequestVoteRequest"
    RequestVoteResponse = "RequestVoteResponse"
    AppendEntriesRequest = "AppendEntriesRequest"
    AppendEntriesResponse = "AppendEntriesResponse"

\* A state with nothing enabled here is a *bound* being reached -- no terms
\* left, no log length left, no messages allowed in flight -- and not a
\* deadlock. TLC's default reading of "no successor" is the opposite one, and
\* it turns every slice boundary into an error.
CHECK_DEADLOCK FALSE

CONSTRAINT StateConstraint

INVARIANT
    TypeOk
    ElectionSafety
    LogMatching
    LeaderCompleteness
    Figure8Rule
    StateMachineSafety
    CommitIsGrounded
    LearnersAreNotVoters
