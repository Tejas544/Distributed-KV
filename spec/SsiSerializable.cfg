\* Serializable: the refresh is on, and write skew must be impossible.
\*
\* Two transactions and two keys is the smallest configuration in which write
\* skew can be written down at all -- it needs each transaction to read what the
\* other writes -- and a configuration in which an anomaly cannot occur is a
\* configuration in which forbidding it says nothing.

SPECIFICATION Spec

CONSTANTS
    Key = {k1, k2}
    Txn = {t1, t2}
    MaxTs = 6
    RefreshReadsOnPush = TRUE
    ParallelCommit = FALSE

    NoRecord = "NoRecord"
    Pending = "Pending"
    Staging = "Staging"
    Committed = "Committed"
    Aborted = "Aborted"

\* Transactions terminate, so a state with nothing enabled is the protocol
\* finishing rather than a deadlock. TLC's default reading of "no successor"
\* is the opposite one.
CHECK_DEADLOCK FALSE

CONSTRAINT StateConstraint

INVARIANT
    TypeOk
    KeyListIsComplete
    CommitIsAllOrNothing
    AbortLeavesNothing
    VersionsCarryCommitTs
    SnapshotIsolation
    NoWriteSkew

PROPERTY TerminalIsFinal
