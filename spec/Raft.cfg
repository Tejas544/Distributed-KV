\* TLC configuration for Raft.tla: elections, replication and the commit rule,
\* over three voters with a fixed membership.
\*
\* Configuration changes are NOT in this run; they are in RaftJoint.cfg. The
\* split is not tidiness. A configuration change names particular servers, which
\* destroys the symmetry that lets TLC explore one representative of each orbit
\* -- and without symmetry this slice does not finish. Measured: with
\* configuration changes enabled and no symmetry, the same bounds passed 78
\* million distinct states at depth 19 and were still growing.
\*
\* Why each bound is where it is:
\*
\*   three voters   the smallest configuration in which a minority exists.
\*   MaxTerm = 3    two elections beyond the initial term, which is the least
\*                  that can produce "committed under one leader, and a
\*                  different leader afterwards".
\*   MaxLogLen = 3  enough for a leader to hold entries from two terms.
\*   MaxMessages    messages in flight, not messages ever sent -- handled
\*                  messages are removed. See Send/Reply/Discard in Raft.tla,
\*                  and the paragraph there about what the first version of
\*                  this got wrong.

SPECIFICATION Spec

CONSTANTS
    Server = {s1, s2, s3}
    Nil = Nil
    Value = {v1, v2}
    InitialVoters = {s1, s2, s3}
    Learners = {}
    ConfigChoices = {}
    MaxTerm = 3
    MaxLogLen = 2
    MaxMessages = 2
    CommitOnlyCurrentTerm = TRUE
    JointRequiresCommit = TRUE
    EnableHeartbeat = FALSE
    Campaigners = {s1, s2, s3}

    Follower = "Follower"
    Candidate = "Candidate"
    Leader = "Leader"

    RequestVoteRequest = "RequestVoteRequest"
    RequestVoteResponse = "RequestVoteResponse"
    AppendEntriesRequest = "AppendEntriesRequest"
    AppendEntriesResponse = "AppendEntriesResponse"

\* Server is a symmetry set: permuting the three servers maps a behaviour to
\* an equivalent one, so TLC may explore one representative of each orbit. That
\* is sound here only because this configuration has no ConfigChoices -- a
\* configuration change naming particular servers breaks the symmetry, which is
\* why joint consensus lives in RaftJoint.cfg and not here.
SYMMETRY ServerSymmetry

\* A state with nothing enabled here is a *bound* being reached -- no terms
\* left, no log length left, no messages allowed in flight -- and not a
\* deadlock. TLC's default reading of "no successor" is the opposite one, and
\* it turns every slice boundary into an error.
CHECK_DEADLOCK FALSE

CONSTRAINT StateConstraint

INVARIANT
    TypeOk
    ElectionSafety
    LogMatching
    LeaderCompleteness
    Figure8Rule
    StateMachineSafety
    CommitIsGrounded
    LearnersAreNotVoters
