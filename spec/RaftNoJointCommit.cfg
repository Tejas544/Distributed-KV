\* NEGATIVE CONTROL for Raft.tla -- REQUIRED TO FAIL.
\*
\* A leader may leave the joint configuration before the joint entry has
\* committed, so C_new becomes sufficient on its own while a majority of C_old
\* still believes it is in charge. This is RaftOptions::joint_requires_commit
\* set to false.
\*
\* ConfigChoices is a *singleton* here, and that is the whole design of the
\* control rather than an arbitrary choice. With C_old = {s1,s2,s3} and
\* C_new = {s1,s2}, every majority of C_new intersects every majority of
\* C_old, so no amount of skipping the joint commit produces two disjoint
\* quorums and the control is vacuous -- it passes, and says nothing. A
\* single-node C_new is the smallest target for which the two configurations
\* have majorities that do not overlap: {s3} alone is a quorum of C_new while
\* {s1,s2} is still a quorum of C_old.
\*
\* Heartbeats are switched off and the search is otherwise as in Raft.cfg; see
\* RaftFigure8.tla on why branching factor rather than depth is what decides
\* whether one of these runs finishes.

SPECIFICATION Spec

CONSTANTS
    Server = {s1, s2, s3}
    Nil = Nil
    Value = {v1, v2}
    InitialVoters = {s1, s2, s3}
    Learners = {}
    ConfigChoices = {{s1}, {s3}}
    MaxTerm = 3
    MaxLogLen = 2
    MaxMessages = 2
    CommitOnlyCurrentTerm = TRUE
    JointRequiresCommit = FALSE
    EnableHeartbeat = FALSE
    Campaigners = {s1, s2, s3}

    Follower = "Follower"
    Candidate = "Candidate"
    Leader = "Leader"

    RequestVoteRequest = "RequestVoteRequest"
    RequestVoteResponse = "RequestVoteResponse"
    AppendEntriesRequest = "AppendEntriesRequest"
    AppendEntriesResponse = "AppendEntriesResponse"

\* A state with nothing enabled here is a *bound* being reached -- no terms
\* left, no log length left, no messages allowed in flight -- and not a
\* deadlock. TLC's default reading of "no successor" is the opposite one, and
\* it turns every slice boundary into an error.
CHECK_DEADLOCK FALSE

CONSTRAINT StateConstraint

INVARIANT
    TypeOk
    ElectionSafety
    LogMatching
    LeaderCompleteness
    Figure8Rule
    StateMachineSafety
    CommitIsGrounded
    LearnersAreNotVoters
