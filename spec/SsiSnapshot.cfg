\* DISCRIMINATION CONTROL -- this configuration is REQUIRED TO FAIL, on
\* NoWriteSkew and on nothing else.
\*
\* Snapshot isolation: the read refresh is switched off, which is
\* CoordinatorOptions::refresh_reads_on_push set to false. Write skew is
\* *legal* at this level, so TLC finding it here is the point.
\*
\* Without this file, "NoWriteSkew holds at serializable" is a claim about a
\* property that might simply be unreachable in a two-transaction slice, and an
\* anomaly nobody can produce is an anomaly nobody has excluded. The pair of
\* runs is what makes the level a measurement instead of an assertion -- the
\* same argument, and the same trap, as the P4 test that had to add an observer
\* transaction before its write-skew history was serializable-invalid at all.
\*
\* Every other invariant must still hold here: snapshot isolation is a weaker
\* level, not a broken one.

SPECIFICATION Spec

CONSTANTS
    Key = {k1, k2}
    Txn = {t1, t2}
    MaxTs = 6
    RefreshReadsOnPush = FALSE
    ParallelCommit = FALSE

    NoRecord = "NoRecord"
    Pending = "Pending"
    Staging = "Staging"
    Committed = "Committed"
    Aborted = "Aborted"

\* Transactions terminate, so a state with nothing enabled is the protocol
\* finishing rather than a deadlock. TLC's default reading of "no successor"
\* is the opposite one.
CHECK_DEADLOCK FALSE

CONSTRAINT StateConstraint

INVARIANT
    TypeOk
    KeyListIsComplete
    CommitIsAllOrNothing
    AbortLeavesNothing
    VersionsCarryCommitTs
    SnapshotIsolation
    NoWriteSkew

PROPERTY TerminalIsFinal
