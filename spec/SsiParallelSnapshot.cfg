\* Parallel commit at SNAPSHOT ISOLATION, where the recovering reader has no
\* refresh to skip. This is the control for SsiParallel.cfg: it establishes
\* that the parallel-commit mechanism itself is sound, and that what fails in
\* the serializable configuration is specifically the interaction between
\* implicit commit and the read refresh -- not staging records in general.
\*
\* NoWriteSkew is not checked here, because snapshot isolation permits it.

SPECIFICATION Spec

CONSTANTS
    Key = {k1, k2}
    Txn = {t1, t2}
    MaxTs = 6
    RefreshReadsOnPush = FALSE
    ParallelCommit = TRUE

    NoRecord = "NoRecord"
    Pending = "Pending"
    Staging = "Staging"
    Committed = "Committed"
    Aborted = "Aborted"

\* Transactions terminate, so a state with nothing enabled is the protocol
\* finishing rather than a deadlock. TLC's default reading of "no successor"
\* is the opposite one.
CHECK_DEADLOCK FALSE

CONSTRAINT StateConstraint

INVARIANT
    TypeOk
    KeyListIsComplete
    CommitIsAllOrNothing
    AbortLeavesNothing
    VersionsCarryCommitTs
    SnapshotIsolation

PROPERTY TerminalIsFinal
