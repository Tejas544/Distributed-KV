\* Trace validation -- REQUIRED TO FAIL on NotReplayed, and the failure is the
\* result. See the header of TraceRaft.tla for why the check is inverted.
\*
\* The bounds are deliberately loose. Everywhere else in this directory the
\* .cfg exists to make a slice small enough to be exhaustive; here there is no
\* search over a class, only a replay of one recorded run, so a bound that bit
\* would cut the replay short and report a conformance failure that is really a
\* configuration failure.
\*
\* Server is {1, 2, 3} rather than model values because TraceLog.tla is
\* generated and has to name servers without knowing what this file calls them.
\* Numbers are the one vocabulary both ends already agree on.
\*
\* MaxHidden = 3 is measured rather than chosen: the exporter decomposes every
\* send into its own observed state, so the only steps left to hide are the
\* receive-side pairs -- UpdateTerm then a handler, a handler then
\* AdvanceCommitIndex, a vote reply then BecomeLeader. Three covers all of them
\* with one to spare, and each extra unit multiplies the work TLC does per
\* checkpoint by the whole branching factor.

SPECIFICATION TraceSpec

CONSTANTS
    Server = {1, 2, 3}
    Nil = 0
    Value = {"v"}
    InitialVoters = {1, 2, 3}
    Learners = {}
    ConfigChoices = {}
    MaxTerm = 20
    MaxLogLen = 20
    MaxMessages = 64
    CommitOnlyCurrentTerm = TRUE
    JointRequiresCommit = TRUE
    EnableHeartbeat = FALSE
    Campaigners = {1, 2, 3}
    MaxHidden = 3
    Verbose = FALSE

    Follower = "Follower"
    Candidate = "Candidate"
    Leader = "Leader"

    RequestVoteRequest = "RequestVoteRequest"
    RequestVoteResponse = "RequestVoteResponse"
    AppendEntriesRequest = "AppendEntriesRequest"
    AppendEntriesResponse = "AppendEntriesResponse"

\* Running out of trace is the end of the replay, not a deadlock.
CHECK_DEADLOCK FALSE

INVARIANT
    NotReplayed
