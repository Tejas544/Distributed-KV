\* Joint consensus, and the run that RaftNoJointCommit.cfg is the control for.
\*
\* No symmetry here: ConfigChoices names s1 and s2 specifically, so permuting
\* the servers does not map a behaviour to an equivalent one. Heartbeats are off
\* and MaxMessages is one lower than Raft.cfg to pay for that -- the slice is
\* smaller in exchange for covering an action Raft.cfg does not.

SPECIFICATION Spec

CONSTANTS
    Server = {s1, s2, s3}
    Nil = Nil
    Value = {v1, v2}
    InitialVoters = {s1, s2, s3}
    Learners = {}
    ConfigChoices = {{s1, s2}}
    MaxTerm = 3
    MaxLogLen = 2
    MaxMessages = 2
    CommitOnlyCurrentTerm = TRUE
    JointRequiresCommit = TRUE
    EnableHeartbeat = FALSE
    Campaigners = {s1, s2}

    Follower = "Follower"
    Candidate = "Candidate"
    Leader = "Leader"

    RequestVoteRequest = "RequestVoteRequest"
    RequestVoteResponse = "RequestVoteResponse"
    AppendEntriesRequest = "AppendEntriesRequest"
    AppendEntriesResponse = "AppendEntriesResponse"

\* A state with nothing enabled here is a *bound* being reached -- no terms
\* left, no log length left, no messages allowed in flight -- and not a
\* deadlock. TLC's default reading of "no successor" is the opposite one, and
\* it turns every slice boundary into an error.
CHECK_DEADLOCK FALSE

CONSTRAINT StateConstraint

INVARIANT
    TypeOk
    ElectionSafety
    LogMatching
    LeaderCompleteness
    Figure8Rule
    StateMachineSafety
    CommitIsGrounded
    LearnersAreNotVoters
